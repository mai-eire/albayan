name: Deploy staging

# Every push to main that passes CI. Production is deliberately not chained to this:
# it has no domain yet, and BETTER_AUTH_URL is baked into every sign-in cookie and
# every link in every email, so an accidental deploy is not a no-op. Release it by
# hand from deploy-production.yml.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

concurrency: deploy-staging

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://albayan-staging.sweet-wave-5485.workers.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A workflow_run job checks out the default branch, which is not necessarily
          # the commit CI just tested; two quick pushes would deploy the wrong one.
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate:staging
      - run: pnpm run deploy -- --env staging
      # A deploy can upload cleanly and still 500 on boot, from a missing secret or a
      # binding that does not resolve. Asking for one page is the cheapest proof.
      - name: Smoke check
        run: >
          curl -fsS --retry 5 --retry-delay 5 -o /dev/null
          https://albayan-staging.sweet-wave-5485.workers.dev/login
