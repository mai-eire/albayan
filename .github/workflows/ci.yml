name: CI

# One workflow, one job graph. Staging waits for `check` only, not for e2e: a throwaway
# with fake data is worth having four minutes after a push, and the smoke check still
# catches a Worker that will not boot. e2e stays the gate on production, which is
# released by hand from deploy-production.yml.
#
#   check ──┬── e2e (3 shards)
#           └── staging
on:
  pull_request:
  push:
    branches: [main]

# Supersede a PR's earlier runs; never cancel a run on main, which may be deploying.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test

  e2e:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # One shard failing should not hide the others' results.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium --with-deps
      # Playwright directly, not `pnpm test:e2e --`: pnpm forwards the bare `--`, so
      # Playwright sees `playwright test -- --shard=1/3`, ignores it and runs all 107
      # tests in every shard.
      - run: pnpm exec playwright test --shard=${{ matrix.shard }}/3
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report
          retention-days: 7

  staging:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: https://albayan-staging.sweet-wave-5485.workers.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate:staging
      - run: pnpm run deploy -- --env staging
      # A deploy can upload cleanly and still 500 on boot, from a missing secret or a
      # binding that does not resolve. Asking for one page is the cheapest proof.
      - name: Smoke check
        run: >
          curl -fsS --retry 5 --retry-delay 5 -o /dev/null
          https://albayan-staging.sweet-wave-5485.workers.dev/login
